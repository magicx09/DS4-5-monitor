name: 问题反馈
description: 输入、配对、显示或音频异常
title: "[问题] "
body:
  - type: textarea
    id: hardware
    attributes:
      label: 硬件与版本
      description: 手柄型号、Pico 2 W、屏幕型号、固件版本、系统。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤与实际表现
      description: 音频问题请补充输出设备、耳机状态、音量锁定。请隐藏 MAC 和个人信息。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为与已尝试的方法
