name: DS4-5-monitor firmware

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prop16:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential python3 curl libusb-1.0-0-dev
      - name: Install pinned SDK and ARM toolchain
        run: |
          bash tools/install_toolchain.sh
          echo "PICO_SDK_PATH=$HOME/pico-sdk" >> "$GITHUB_ENV"
          version=$(sed -n 's/^ARM_TOOLCHAIN_VERSION=//p' tools/toolchain.env)
          echo "$HOME/.local/opt/arm-gnu-toolchain-$version/bin" >> "$GITHUB_PATH"
      - name: Host tests including both renderers
        run: |
          cmake -S tests/host -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTINYUSB_SOURCE="$PICO_SDK_PATH/lib/tinyusb/src"
          cmake --build build/host -j 4
          ctest --test-dir build/host --output-on-failure
      - name: Build only prop16
        run: |
          cmake -S . -B build/prop16 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DPICO_BOARD=pico2_w -DDS5_CLOCK_KHZ=150000 -DENABLE_DS4=ON -DENABLE_SERIAL=OFF -DENABLE_COMPANION_VENDOR=OFF -DOLED_ZH=ON -DOLED_SETTINGS_ROW_HEIGHT=16 -DVERSION="$(cat VERSION)"
          cmake --build build/prop16 --target ds5-bridge -j 4
      - name: Verify firmware
        run: |
          python3 tools/check_flash_reserved.py build/prop16/ds5-bridge-oled.elf build/prop16/ds5-bridge-oled.uf2
          bash tools/check_ram_residency.sh build/prop16/ds5-bridge-oled.elf
          bash tools/check_xip_setup.sh build/prop16/ds5-bridge-oled.elf 2 11
          mkdir -p artifacts
          version=$(cat VERSION)
          cp build/prop16/ds5-bridge-oled.uf2 "artifacts/DS4-5-monitor-$version-pico2w-zh-prop16.uf2"
          cd artifacts
          sha256sum *.uf2 > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: DS4-5-monitor-prop16
          path: artifacts/
          if-no-files-found: error
